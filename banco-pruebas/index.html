<script>
// Datos simulados: imitan las respuestas de /wp-json/pieb/v1/.
(function () {

  if (idiomaElegido && idiomaElegido.indexOf('es') !== 0) {
    document.write('<script src="i18n/' + idiomaElegido + '.js"><\/script>');
  }
  document.getElementById('pieb-cancionero').setAttribute('data-pcan-theme', tema);
  window.PIEB_CANCIONERO = {

  var cultos = [

    { id: 902, titulo: 'Culto dominical', fecha: dias(-3), tipo: 'Culto dominical', notas: '', items: [{ cancion: 437, tonalidad: '', nota: '' }, { cancion: 436, tonalidad: '', nota: '' }], creadoPor: 'Ana', puedeBorrar: true },

  function detalleCancion(c) {
    return Object.assign({}, c, {
      notas: c.id === 432 ? 'Empezar suave, coro entra en la segunda estrofa.' : '',

      editables: c.editables ? [{ id: 3, descripcion: 'Arreglo coro', url: '#', archivo: 'a-cristo-coronad.mscz', tamano: 48213 }, { id: 4, descripcion: '', url: '#', archivo: 'a-cristo-coronad.musicxml', tamano: 151022 }].slice(0, c.editables) : [],
      youtube: c.youtube ? [{ url: 'https://youtu.be/dQw4w9WgXcQ', label: 'Coro', videoId: 'dQw4w9WgXcQ' }] : [],
      subidaPor: 'Ana', puedeBorrar: true
    });
  }
  function detalleCulto(c) {
    return Object.assign({}, c, { items: c.items.map(function (it) {

    }) });
  }
  // Ajustes y equipo: la lista guardada vive aquí para que guardar y enviar la bienvenida se noten al volver a abrir.
  var ahoraS = function () { return Math.floor(Date.now() / 1000); };
  var ajustesMock = {
    nombre: 'Cancionero', subtitulo: 'Tu iglesia', version: '1.5.5', administradores: ['ana@example.com'], papeleraDias: 30, temaDefecto: 'claro',
    googleClientId: '', dominio: '', origen: location.origin, bienvenidaAuto: true, bienvenidaTexto: 'Encontrarás el cancionero en el menú «Música» de nuestra web.', pagina: '',
    avisoBorrado: true, correoAdmin: 'webmaster@example.com',
    emails: ['ana@example.com', 'luis@example.com', 'marta@example.com', 'pablo@example.com', 'sara@example.com', 'falla@example.com', 'admin@example.com'],
    miembros: [
      { email: 'ana@example.com', nombre: 'Ana Pérez', haEntrado: true, enLista: true, esGestor: true, esAdmin: false, puedeBienvenida: true, bienvenida: ahoraS() - 40 * 86400 },
      { email: 'luis@example.com', nombre: 'Luis Gómez', haEntrado: true, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: 0 },
      { email: 'marta@example.com', nombre: 'Marta Ruiz', haEntrado: false, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: ahoraS() - 5 * 86400 },
      { email: 'pablo@example.com', nombre: '', haEntrado: false, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: 0 },
      { email: 'sara@example.com', nombre: 'Sara Díaz', haEntrado: false, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: 0 },
      { email: 'falla@example.com', nombre: '', haEntrado: false, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: 0 },
      { email: 'admin@example.com', nombre: 'Administración', haEntrado: true, enLista: true, esGestor: true, esAdmin: true, puedeBienvenida: false, bienvenida: 0 },
      { email: 'antiguo@example.com', nombre: 'Voluntario antiguo', haEntrado: true, enLista: false, esGestor: false, esAdmin: false, puedeBienvenida: false, bienvenida: 0 }
    ]
  };
  function minusculas(emails) { return (emails || []).map(function (e) { return String(e).toLowerCase(); }); }
  // Cuentas que tienen un rol propio (administrador de la web, o con el rol del equipo pero fuera de la lista): quitarlas de la lista no las borra.
  var conRolMock = ['admin@example.com', 'antiguo@example.com'];
  // POST ajustes: guarda lo que llega (todo es opcional, como en el servidor) y devuelve los ajustes completos, con los
  // miembros recalculados a partir de `emails` y `administradores`, y los correos nuevos que deben recibir ya la bienvenida automática.
  function guardarAjustesMock(cuerpo) {
    ['nombre', 'subtitulo', 'papeleraDias', 'temaDefecto', 'googleClientId', 'dominio', 'bienvenidaAuto', 'bienvenidaTexto', 'avisoBorrado', 'pagina']
      .forEach(function (k) { if (cuerpo[k] !== undefined) { ajustesMock[k] = cuerpo[k]; } });
    var pendientes = [];
    if (cuerpo.emails !== undefined || cuerpo.administradores !== undefined) {
      var antes = minusculas(ajustesMock.emails);
      var admins = cuerpo.administradores !== undefined ? minusculas(cuerpo.administradores) : minusculas(ajustesMock.administradores);
      var emails = cuerpo.emails !== undefined ? minusculas(cuerpo.emails) : antes.slice();
      // Un administrador siempre tiene acceso: se añade también a la lista.
      admins.forEach(function (e) { if (emails.indexOf(e) === -1) { emails.push(e); } });
      // Como el servidor: no se envía a quien ya la recibió, ya ha entrado alguna vez o es una cuenta de administración.
      pendientes = emails.filter(function (e) {
        var mb = ajustesMock.miembros.filter(function (x) { return x.email === e; })[0];
        return antes.indexOf(e) === -1 && !(mb && (mb.bienvenida || mb.haEntrado || mb.esAdmin));
      });
      emails.forEach(function (e) {
        if (!ajustesMock.miembros.some(function (mb) { return mb.email === e; })) {
          ajustesMock.miembros.push({ email: e, nombre: '', haEntrado: false, enLista: true, esGestor: false, esAdmin: false, puedeBienvenida: true, bienvenida: 0 });
        }
      });
      ajustesMock.miembros.forEach(function (mb) {
        mb.enLista = emails.indexOf(mb.email) !== -1;
        mb.esGestor = admins.indexOf(mb.email) !== -1 || mb.esAdmin;
        mb.puedeBienvenida = !mb.esAdmin && mb.enLista;
      });
      ajustesMock.miembros = ajustesMock.miembros
        .filter(function (mb) { return mb.enLista || conRolMock.indexOf(mb.email) !== -1; })
        .sort(function (x, y) { return x.email < y.email ? -1 : 1; });
      ajustesMock.emails = emails;
      ajustesMock.administradores = admins;
    }
    return Object.assign({}, ajustesMock, { bienvenidaPendiente: ajustesMock.bienvenidaAuto ? pendientes : [] });
  }
  // POST bienvenida: todos «enviados» salvo los que contienen «falla», que van a «fallidos»; una prueba va solo a Ana.
  function bienvenidaMock(cuerpo) {
    if (cuerpo.prueba) { return { enviados: ['ana@example.com'] }; }
    var r = { enviados: [], fallidos: [], omitidos: [], momento: ahoraS() };
    (cuerpo.emails || []).forEach(function (e) {
      if (/falla/i.test(e)) { r.fallidos.push({ email: e, motivo: 'el servidor de correo lo rechazó' }); return; }
      r.enviados.push(e);
      ajustesMock.miembros.forEach(function (mb) { if (mb.email === String(e).toLowerCase()) { mb.bienvenida = r.momento; } });
    });
    return r;
  }
  // Accesos (GET accesos): personas con sus inicios de sesión y días de uso, generados a partir de hoy para que siempre haya datos.
  // ?accesos=vacio prueba el estado sin registro; ?accesos=error hace fallar la primera petición (para probar «Reintentar»).
  function dia(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var accesosFallos = params.get('accesos') === 'error' ? 1 : 0;
  function accesosMock() {
    if (params.get('accesos') === 'vacio') { return { desde: 0, ahora: ahoraS(), hoy: dia(hoy), personas: [] }; }
    var semilla = 7;
    function azar() { semilla = (semilla * 16807) % 2147483647; return semilla / 2147483647; }
    function elegir(lista) { return lista[Math.floor(azar() * lista.length)]; }
    var DESDE = 150; // el registro empezó hace unos 5 meses
    // d: [desde hace N días, hasta hace N días], prob: [domingo, miércoles, otros días], mm / dd: métodos y dispositivos que usa.
    var perfiles = [
      { email: 'ana@example.com', nombre: 'Ana Pérez', enLista: true, esGestor: true, cuenta: true, rango: [150, 0], prob: [0.95, 0.45, 0.12], mm: ['google', 'google', 'enlace'], dd: ['ordenador', 'ordenador', 'movil'] },
      { email: 'luis@example.com', nombre: 'Luis Gómez', enLista: true, rango: [140, 0], prob: [0.85, 0.2, 0.05], mm: ['enlace'], dd: ['movil', 'movil', 'tableta'] },
      { email: 'marta@example.com', nombre: 'Marta Ruiz', enLista: true, rango: [120, 1], prob: [0.6, 0.1, 0.03], mm: ['enlace', 'google'], dd: ['movil'] },
      { email: 'pablo@example.com', nombre: '', enLista: true, rango: [135, 45], prob: [0.7, 0.15, 0.05], mm: ['enlace'], dd: ['tableta', 'movil'] },
      { email: 'elena@example.com', nombre: 'Elena Torres', enLista: true, rango: [26, 0], prob: [1, 0.4, 0.15], mm: ['enlace'], dd: ['tableta'] },
      { email: 'jorge@example.com', nombre: 'Jorge Ramos', enLista: true, rango: [100, 0], prob: [0.3, 0.08, 0.04], mm: ['google'], dd: ['movil', 'ordenador'] },
      { email: 'admin@example.com', nombre: 'Administración', enLista: true, esAdmin: true, esGestor: true, cuenta: true, rango: [150, 0], prob: [0.15, 0.25, 0.1], mm: ['contrasena'], dd: ['ordenador'] },
      { email: 'antiguo@example.com', nombre: 'Voluntario antiguo', enLista: false, rango: [145, 95], prob: [0.5, 0.1, 0.02], mm: ['enlace'], dd: ['movil'] },
      // Entró antes de que existiera el registro: haEntrado, pero sin accesos ni días anotados.
      { email: 'falla@example.com', nombre: '', enLista: true, rango: null, entroAntes: true },
      // Nunca ha entrado.
      { email: 'sara@example.com', nombre: 'Sara Díaz', enLista: true, rango: null }
    ];
    var personas = perfiles.map(function (pf) {
      var accesos = [], dias = [], ultimoUso = null;
      if (pf.rango) {
        for (var n = pf.rango[0]; n >= pf.rango[1]; n--) {
          var f = new Date(hoy); f.setDate(f.getDate() - n);
          var sem = f.getDay(), p = sem === 0 ? pf.prob[0] : sem === 3 ? pf.prob[1] : pf.prob[2];
          if (azar() >= p) { continue; }
          dias.push(dia(f));
          // Con «recordarme» la sesión dura 14 días: solo hay inicio de sesión tras una pausa larga o de vez en cuando.
          if (ultimoUso === null || ultimoUso - n >= 10 || azar() < 0.2) {
            var hora = sem === 0 ? 8 + azar() * 3 : 18 + azar() * 4;
            var t = new Date(f); t.setHours(Math.floor(hora), Math.floor(azar() * 60), 0, 0);
            if (t.getTime() < Date.now()) { accesos.push({ t: Math.floor(t.getTime() / 1000), metodo: elegir(pf.mm), dispositivo: elegir(pf.dd) }); }
          }
          ultimoUso = n;
        }
      }
      accesos.reverse(); dias.reverse(); // el más nuevo primero
      return {
        email: pf.email, nombre: pf.nombre, enLista: pf.enLista, esAdmin: !!pf.esAdmin, esGestor: !!pf.esGestor, cuenta: !!pf.cuenta,
        haEntrado: !!(pf.entroAntes || accesos.length || dias.length), ultimoAcceso: accesos.length ? accesos[0].t : 0, accesos: accesos, dias: dias
      };
    });
    return { desde: ahoraS() - DESDE * 86400, ahora: ahoraS(), hoy: dia(hoy), personas: personas };
  }
  var real = window.fetch;
  window.fetch = function (url, opts) {
    var m = String(url).match(/^\/api\/(.*)$/);
    if (!m) { return real.apply(this, arguments); }
    var ruta = m[1], datos = {}, espera = 0, estado = 200;
    var mc;
    var cuerpo = {};
    try { cuerpo = opts && opts.body ? JSON.parse(opts.body) : {}; } catch (e) { cuerpo = {}; }
    if (ruta === 'canciones') { datos = canciones; }
    else if ((mc = ruta.match(/^canciones\/(\d+)$/))) { datos = detalleCancion(canciones.filter(function (c) { return c.id === +mc[1]; })[0]); }
    else if (ruta === 'cultos' && (!opts || !opts.method || opts.method === 'GET')) { datos = cultos; }
    else if ((mc = ruta.match(/^cultos\/(\d+)$/))) { datos = detalleCulto(cultos.filter(function (c) { return c.id === +mc[1]; })[0]); }
    else if (ruta === 'etiquetas') { datos = {}; }
    else if (ruta === 'copia/cancion') { datos = { ok: true, estado: 'creada' }; }
    else if (ruta === 'copia/culto') { datos = { ok: true, estado: 'creado' }; }
    else if (ruta === 'copia/estado') { datos = { canciones: [5, 0, 7, 0, 0], cultos: [] }; }
    else if (ruta === 'papelera') { datos = { dias: 30, canciones: [
      { id: 301, titulo: 'Cantad al Señor', numero: '10', tonalidad: 'Sol', archivos: 2, borradaEl: dias(-3) + 'T10:00:00Z', borradaPor: 'Ana', caduca: '', diasRestantes: 27 },
      { id: 302, titulo: 'Cuán dulce es el amor', numero: '', tonalidad: '', archivos: 1, borradaEl: dias(-20) + 'T10:00:00Z', borradaPor: '', caduca: '', diasRestantes: 10 }] }; }
    else if (ruta === 'archivos/estado') { datos = { pendientes: 3, proteccion: 'expuesto', tanda: 50 }; }
    else if (ruta === 'ajustes' && opts && opts.method === 'POST') { datos = guardarAjustesMock(cuerpo); }
    else if (ruta === 'ajustes') { datos = ajustesMock; }
    else if (ruta === 'bienvenida') { datos = bienvenidaMock(cuerpo); espera = 400; }
    else if (ruta === 'accesos') {
      espera = 500;
      if (accesosFallos > 0) { accesosFallos--; estado = 500; datos = { message: 'El servidor no responde' }; } else { datos = accesosMock(); }
    }
    else { datos = { ok: true }; }
    var respuesta = function () { return new Response(JSON.stringify(datos), { status: estado, headers: { 'Content-Type': 'application/json' } }); };
    if (!espera) { return Promise.resolve(respuesta()); }
    return new Promise(function (resolver) { setTimeout(function () { resolver(respuesta()); }, espera); });
  };
})();
